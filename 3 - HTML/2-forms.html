<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Forms</title>
  </head>
  <body>
    <h1>HTML Forms</h1>
    <!-- POST - used for backend to save the details from the form -->
    <!-- when method is POST, we also need a data on action type on who will handle the details -->
    <form action="" method="post">
      <div>
        <label for="fullname-id">Name:</label>
        <input
          type="text"
          name="user-fullname"
          id="fullname-id"
          placeholder="Katrina Castillo"
          required
        />
      </div>

      <div>
        <label for="email-id">Email Address:</label>
        <input
          type="email"
          name="user-email"
          id="email-id"
          placeholder="katrina.castillo@gmail.com"
          required
        />
      </div>

      <div>
        <label for="password-id">Password:</label>
        <input
          type="password"
          name="user-password"
          id="password-id"
          placeholder="*******"
          required
        />
      </div>

      <div>
        <label for="age-id">Age:</label>
        <input
          type="number"
          name="user-age"
          id="age-id"
          placeholder="18"
          required
          min="18"
          max="60"
        />
      </div>

      <div>
        <label for="message-id">Message:</label>
        <br />
        <textarea
          name="user-message"
          id="message-id"
          placeholder="What's on your mind?"
          rows="10"
          cols="30"
        ></textarea>
      </div>

      <div>
        <label for="gender-id">Gender:</label>
        <select name="user-gender" id="gender-id">
          <option value="none" disabled selected hidden>
            --Select your Gender--
          </option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="others">Others</option>
        </select>
      </div>

      <div>
        <input
          type="radio"
          name="user-profile-status"
          id="public-id"
          value="public"
        />
        <label for="public-id">Public</label>
        <input
          type="radio"
          name="user-profile-status"
          id="private-id"
          value="private"
        />
        <label for="private-id">Private</label>
      </div>

      <div>
        <div>
          <input type="checkbox" name="genre" id="action-id" value="action" />
          <label for="action-id">Action</label>

          <input type="checkbox" name="genre" id="horror-id" value="horror" />
          <label for="horror-id">Horror</label>

          <input type="checkbox" name="genre" id="rom-com-id" value="rom-com" />
          <label for="action-id">RomCom</label>
        </div>

        <div>
          <input
            type="checkbox"
            name="genre"
            id="documentary-id"
            value="documentary"
          />
          <label for="documentary-id">Documentary</label>

          <input type="checkbox" name="genre" id="comedy-id" value="comedy" />
          <label for="comedy-id">Comedy </label>

          <input
            type="checkbox"
            name="genre"
            id="suspense-id"
            value="suspense"
          />
          <label for="suspense-id">Suspense</label>

          <input
            type="checkbox"
            name="genre"
            id="adventure-id"
            value="adventure"
          />
          <label for="adventure-id">adventure</label>
        </div>
      </div>

      <div>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </div>
    </form>
  </body>
</html>
